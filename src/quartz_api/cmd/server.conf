// HOCON environment configuration schema for the Quartz API.
// DO NOT EDIT this file to configure the application! Use the specified environment variables.

api {
  // The port on which to run the REST server
  port = 8000
  port = ${?PORT}
  loglevel = "info"
  loglevel = ${?LOGLEVEL}
  // Comma seperated list of routers to enable
  // Supported routers: "sites", "regions", "substations", "uk_national"
  routers = ""
  routers = ${?ROUTERS}
  origins = "*"
  origins = ${?ORIGINS}
  // The IANA timezone string to use for date/time operations
  timezone = "UTC"
  timezone = ${?TZ}
  // URL used for API documentation
  host_url = "host-url-not-set"
  host_url = ${?HOST_URL} 
  workers = 1
  workers = ${?NUM_WORKERS}
}

// The backend to use for the service
// Supported backends: "dummydb", "quartzdb", "dataplatform"
backend {
  source = "dummydb"
  source = ${?SOURCE}
  quartzdb {
    database_url = ${?DB_URL}
  }
  dummydb {}
  dataplatform {
    host = localhost
    host = ${?DATA_PLATFORM_HOST}
    port = 50051
    port = ${?DATA_PLATFORM_PORT}
  }
}

// Auth0 configuration
auth0 {
  domain = ""
  domain = ${?AUTH0_DOMAIN}
  audience = ""
  audience = ${?AUTH0_AUDIENCE}
  // Client ID for the API description, not needed for authentication
  client_id = "client-id-not-set"
  client_id = ${?AUTH0_CLIENT_ID}
}

// Sentry configuration
sentry {
  dsn = ""
  dsn = ${?SENTRY_DSN}
  environment = "local"
  environment = ${?ENVIRONMENT}
}

// Cache refresh token — set to a secret value; passed by Airflow as X-Refresh-Token
// to POST /v0/solar/GB/gsp/forecast/all/refresh to pre-warm the GSP forecast cache.
cache {
  refresh_token = ""
  refresh_token = ${?CACHE_REFRESH_TOKEN}
  // Cache backend: "inmemory", "redis", or "memcache"
  // Use redis or memcache for production with multiple workers
  backend = "inmemory"
  backend = ${?CACHE_BACKEND}
  // Connection URL for redis (redis://host:6379) or memcache (host:11211)
  url = ""
  url = ${?CACHE_URL}
}

// Apitally configuration
apitally {
  client_id = ""
  client_id = ${?APITALLY_CLIENT_ID}
  environment = "local"
  environment = ${?ENVIRONMENT}
}

