// HOCON environment configuration schema for the Quartz API.
// DO NOT EDIT this file to configure the application! Use the specified environment variables.

api {
  // The port on which to run the REST server
  port = 8000
  port = ${?PORT}
  loglevel = "info"
  loglevel = ${?LOGLEVEL}
  // Comma seperated list of routers to enable
  // Supported routers: "sites", "regions", "substations", "uk_national", "v1"
  routers = ""
  routers = ${?ROUTERS}
  origins = "*"
  origins = ${?ORIGINS}
  // The IANA timezone string to use for date/time operations
  timezone = "UTC"
  timezone = ${?TZ}
  // Deployment environment. Debug error pages are disabled when this is "production".
  environment = "local"
  environment = ${?ENVIRONMENT}
  // URL used for API documentation
  host_url = "host-url-not-set"
  host_url = ${?HOST_URL} 
  workers = 1
  workers = ${?NUM_WORKERS}
}

// The backend to use for the service
// Supported backends: "dummydb", "quartzdb", "dataplatform"
backend {
  source = "dummydb"
  source = ${?SOURCE}
  quartzdb {
    database_url = ${?DB_URL}
  }
  dummydb {}
  dataplatform {
    host = localhost
    host = ${?DATA_PLATFORM_HOST}
    port = 50051
    port = ${?DATA_PLATFORM_PORT}
  }
}

// Auth0 configuration
auth0 {
  domain = ""
  domain = ${?AUTH0_DOMAIN}
  audience = ""
  audience = ${?AUTH0_AUDIENCE}
  // Client ID for the API description, not needed for authentication
  client_id = "client-id-not-set"
  client_id = ${?AUTH0_CLIENT_ID}
}

// Sentry configuration
sentry {
  dsn = ""
  dsn = ${?SENTRY_DSN}
  environment = "local"
  environment = ${?ENVIRONMENT}
}

// Cache refresh token — set to a secret value; passed by Airflow as X-Refresh-Token
// to POST /v0/solar/GB/gsp/forecast/all/refresh to pre-warm the GSP forecast cache.
cache {
  refresh_token = ""
  refresh_token = ${?CACHE_REFRESH_TOKEN}
}

// Apitally configuration
apitally {
  client_id = ""
  client_id = ${?APITALLY_CLIENT_ID}
  environment = "local"
  environment = ${?ENVIRONMENT}
}

// Satellite data configuration
satellite {
  aws_region = "eu-west-1"
  aws_region = ${?AWS_DEFAULT_REGION}
  geotiff_bucket = "historical-cloud-data-geotiff"
  geotiff_bucket = ${?HISTORIC_SAT_S3_BUCKET}
  source_bucket = "nowcasting-sat-development"
  source_bucket = ${?RAW_SAT_S3_BUCKET}
  icechunk_bucket = "nowcasting-sat-icechunk"
  icechunk_bucket = ${?ICECHUNK_S3_BUCKET}
  icechunk_prefix = "sat"
  icechunk_prefix = ${?ICECHUNK_S3_PREFIX}
}
